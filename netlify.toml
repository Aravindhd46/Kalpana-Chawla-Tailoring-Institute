[build]
  command = "([ -x node_modules/.bin/vite ] || npx -y pnpm@10.30.3 install --frozen-lockfile) && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/send-enquiry"
  to = "/.netlify/functions/send-enquiry"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
